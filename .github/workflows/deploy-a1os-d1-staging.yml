name: Deploy A1OS D1 Queue (staging only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a1os-queue-staging-deploy
  cancel-in-progress: false
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cf-workers/a1os-task-queue
    env:
      CLOUDFLARE_ACCOUNT_ID: d9be8d8a7f91cb703d7c6210ef413c6a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Generate isolated staging configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = 'a1os-d1-task-queue-staging';
          config.workers_dev = false;
          config.d1_databases[0].database_name = 'a1os-task-queue-staging';
          config.d1_databases[0].database_id = '6b585263-15b3-43e5-bbb2-e4ec45eecfa0';
          fs.writeFileSync('wrangler.staging.json', JSON.stringify(config, null, 2));
          NODE
      - name: Deploy staging Worker without public workers.dev route
        run: npx wrangler deploy --config wrangler.staging.json
      - name: Verify deployment metadata
        run: npx wrangler deployments list --name a1os-d1-task-queue-staging
