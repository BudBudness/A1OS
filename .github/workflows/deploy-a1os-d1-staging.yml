name: Deploy A1OS D1 Queue (staging only)
on:
  push:
    paths:
      - '.github/workflows/deploy-a1os-d1-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a1os-queue-staging-deploy
  cancel-in-progress: false
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: cf-workers/a1os-task-queue
    env:
      CLOUDFLARE_ACCOUNT_ID: d9be8d8a7f91cb703d7c6210ef413c6a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require deployment credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Generate isolated staging configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = 'a1os-d1-task-queue-staging';
          config.workers_dev = false;
          config.d1_databases[0].database_name = 'a1os-task-queue-staging';
          config.d1_databases[0].database_id = '6b585263-15b3-43e5-bbb2-e4ec45eecfa0';
          fs.writeFileSync('wrangler.staging.json', JSON.stringify(config, null, 2));
          NODE
      - name: Deploy staging Worker without public workers.dev route
        run: npx wrangler deploy --config wrangler.staging.json
      - name: Verify deployment metadata
        run: npx wrangler deployments list --name a1os-d1-task-queue-staging

      - name: Enforce staging binding and private endpoint release gate
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/a1os-d1-task-queue-staging';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const get=async suffix=>{
            const r=await fetch(root+suffix,{headers,signal:AbortSignal.timeout(15000)});
            assert.equal(r.status,200,'Cloudflare API '+suffix);
            const body=await r.json();
            assert.equal(body.success,true,'Cloudflare API success '+suffix);
            return body.result;
          };
          const settings=await get('/settings');
          const bindings=settings.bindings??[];
          assert.ok(bindings.some(b=>b.name==='DB'&&b.type==='d1'&&b.database_id==='6b585263-15b3-43e5-bbb2-e4ec45eecfa0'),'staging D1 binding');
          assert.ok(bindings.some(b=>b.name==='TASK_QUEUE_TOKEN'&&b.type==='secret_text'),'auth secret binding');
          const subdomain=await get('/subdomain');
          assert.equal(subdomain.enabled,false,'staging workers.dev must remain disabled');
          assert.equal(subdomain.previews_enabled,false,'staging preview URLs must remain disabled');
          console.log('PASS: correct staging D1, authentication secret, no public endpoint');
          NODE
