name: production-e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        run: |
          set -euo pipefail
          curl_json() {
            curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$1"
          }

          curl_json https://a1-os.vercel.app/health > health.json
          curl_json https://a1-os.vercel.app/ready > ready.json
          curl_json https://a1-os.vercel.app/ping > ping.json

          cat health.json ready.json ping.json

          python - <<'PY'
          import json

          health = json.load(open("health.json"))
          ready = json.load(open("ready.json"))
          ping = json.load(open("ping.json"))

          assert health == {"status": "healthy", "service": "a1os-api"}, health
          assert ready == {
              "status": "ready",
              "service": "a1os-api",
              "execution_mode": "serverless-safe",
          }, ready
          assert ping == {"status": "ok"}, ping

          print("A1OS production E2E: PASS")
          PY

      - name: Upload live responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1os-production-e2e-responses
          path: "*.json"
          if-no-files-found: ignore
