name: production-e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        run: pytest -q

  smoke:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        run: |
          set -euo pipefail
          curl_json() {
            curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$1"
          }
          curl_json https://a1-os.vercel.app/health > health.json
          curl_json https://a1-os.vercel.app/ready > ready.json
          curl_json https://a1-os.vercel.app/ping > ping.json
          python - <<'PY'
          import json
          health = json.load(open("health.json"))
          ready = json.load(open("ready.json"))
          ping = json.load(open("ping.json"))
          assert health == {"status": "healthy", "service": "a1os-api"}, health
          assert ready == {
              "status": "ready",
              "service": "a1os-api",
              "execution_mode": "cloud-queue",
              "persistence": "supabase",
          }, ready
          assert ping == {"ping": "pong"}, ping
          print("A1OS production smoke: PASS")
          PY

  production-queue:
    if: github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.A1OS_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.A1OS_SUPABASE_SECRET_KEY }}
      A1OS_EXECUTE_SECRET: ${{ secrets.A1OS_EXECUTE_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate E2E secrets
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$A1OS_EXECUTE_SECRET"
      - name: Start isolated production worker
        run: |
          set -euo pipefail
          python -m core.worker > worker.log 2>&1 &
          echo "$!" > worker.pid
          sleep 5
      - name: Submit signed production task
        id: submit
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, hmac, json, os, urllib.request
          payload = {
              "target": "a1os",
              "role": "system",
              "action": "printf control-plane",
              "data": {},
          }
          canonical = json.dumps(
              {k: payload[k] for k in ("target", "role", "action", "data")},
              sort_keys=True,
              separators=(",", ":"),
              default=str,
          ).encode()
          signature = hmac.new(
              os.environ["A1OS_EXECUTE_SECRET"].encode(),
              canonical,
              hashlib.sha256,
          ).hexdigest()
          request = urllib.request.Request(
              "https://a1-os.vercel.app/v1/execute",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "X-Signature": signature,
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = json.load(response)
          assert body.get("status") == "accepted", body
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"task_id={body['task_id']}\n")
          PY
      - name: Poll Supabase for completion
        env:
          TASK_ID: ${{ steps.submit.outputs.task_id }}
        run: |
          set -euo pipefail
          python - "$TASK_ID" <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request
          task_id = sys.argv[1]
          query = urllib.parse.urlencode({
              "task_id": f"eq.{task_id}",
              "select": "task_id,target,action,status,attempts,error,completed_at",
          })
          url = f"{os.environ['SUPABASE_URL'].rstrip('/')}/rest/v1/a1os_tasks?{query}"
          headers = {
              "apikey": os.environ["SUPABASE_SECRET_KEY"],
              "Authorization": f"Bearer {os.environ['SUPABASE_SECRET_KEY']}",
          }
          deadline = time.time() + 120
          last = None
          while time.time() < deadline:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  rows = json.load(response)
              if rows:
                  last = rows[0]
                  print(json.dumps(last, sort_keys=True))
                  if last["status"] == "completed":
                      assert last["error"] is None, last
                      assert last["completed_at"], last
                      raise SystemExit(0)
                  if last["status"] == "failed":
                      raise SystemExit(f"Production task failed: {last}")
              time.sleep(3)
          raise SystemExit(f"Timed out waiting for task completion: {last}")
          PY
      - name: Dump worker log on failure
        if: failure()
        run: cat worker.log || true
      - name: Stop isolated worker
        if: always()
        run: kill "$(cat worker.pid)" 2>/dev/null || true
