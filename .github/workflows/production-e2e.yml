name: A1OS regression tests (production dispatch disabled)

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/production-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/production-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run local execution and authentication regression tests
        run: pytest -q tests/test_worker_dispatch.py tests/test_worker_singleton.py tests/test_execution_broker.py
