name: A1OS Queue Local HTTP Integration
on:
  push:
    paths:
      - '.github/workflows/a1os-queue-http-integration.yml'
      - 'cf-workers/a1os-task-queue/**'
      - 'scripts/verify_cloudflare_queue_e2e.py'
      - 'core/persistence/cloudflare_tasks.py'
      - 'core/queue/durable.py'
      - 'core/worker.py'
      - 'tests/test_worker_cloudflare_adapter.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-workers/a1os-task-queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Verify application worker uses the Cloudflare-capable durable queue facade
        working-directory: .
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_worker_cloudflare_adapter.py
      - name: Start isolated local D1 Worker
        run: |
          cat > wrangler.integration.json <<'JSON'
          {"name":"a1os-d1-task-queue-integration","main":"src/index.ts","compatibility_date":"2026-11-17","d1_databases":[{"binding":"DB","database_name":"a1os-task-queue-integration","database_id":"00000000-0000-4000-8000-000000000001","migrations_dir":"migrations"}]}
          JSON
          printf 'TASK_QUEUE_TOKEN=integration-test-only-token\n' > .dev.vars
          npx wrangler d1 migrations apply a1os-task-queue-integration --local --config wrangler.integration.json
          nohup npx wrangler dev --local --config wrangler.integration.json --port 8787 > /tmp/a1os-worker.log 2>&1 &
          for i in $(seq 1 45); do if curl -fsS http://127.0.0.1:8787/health > /dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/a1os-worker.log
          exit 1
      - name: Verify Python DurableQueue HTTP lifecycle against isolated Worker
        working-directory: .
        env:
          A1OS_TASK_QUEUE_URL: http://127.0.0.1:8787
          A1OS_TASK_QUEUE_TOKEN: integration-test-only-token
        run: |
          python -m pip install httpx
          python scripts/verify_cloudflare_queue_e2e.py
      - name: Exercise live HTTP authentication and task lifecycle
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:8787';
          const token='integration-test-only-token';
          const req=async(path,method='GET',body,auth=true)=>{
            const r=await fetch(base+path,{method,headers:{...(auth?{authorization:'Bearer '+token}:{}),...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
            return {status:r.status,data:await r.json()};
          };
          let r=await req('/health','GET',undefined,false);
          assert.equal(r.status,200);assert.equal(r.data.ok,true);
          r=await req('/v1/tasks/pending','GET',undefined,false);
          assert.equal(r.status,401);
          const invalidAuth=await fetch(base+'/v1/tasks/pending',{headers:{authorization:'Bearer incorrect-token'}});
          assert.equal(invalidAuth.status,401,'reject incorrect bearer token');
          r=await req('/v1/tasks','POST',{target:'',role:'tester',action:'noop'});
          assert.equal(r.status,400,'reject invalid task');
          r=await req('/v1/tasks','POST',{target:'staging',role:'tester',action:'noop',max_attempts:21});
          assert.equal(r.status,400,'reject excessive retries');
          const id='integration-smoke';
          const payload={task_id:id,target:'staging',role:'tester',action:'noop',payload:{smoke:true}};
          r=await req('/v1/tasks','POST',payload);assert.equal(r.status,201);
          r=await req('/v1/tasks','POST',payload);assert.equal(r.status,200);
          r=await req('/v1/tasks/pending');assert.equal(r.status,200);assert.ok(r.data.data.some(x=>x.task_id===id));
          r=await req('/v1/tasks/'+id+'/claim','POST');assert.equal(r.status,200);assert.equal(r.data.task.status,'running');
          r=await req('/v1/tasks/'+id+'/complete','POST');assert.equal(r.status,200);assert.equal(r.data.task.status,'completed');
          r=await req('/v1/tasks/'+id);assert.equal(r.status,200);assert.equal(r.data.data.status,'completed');
          r=await req('/v1/tasks/'+id+'/claim','POST');assert.equal(r.status,409,'completed task cannot be reclaimed');
          r=await req('/v1/tasks/'+id+'/complete','POST');assert.equal(r.status,409,'completed task cannot be completed twice');
          r=await req('/v1/tasks','POST',{...payload,action:'different'});assert.equal(r.status,409,'conflicting idempotency key');
          const retryId='integration-retry';
          r=await req('/v1/tasks','POST',{task_id:retryId,target:'staging',role:'tester',action:'noop',max_attempts:2});assert.equal(r.status,201);
          r=await req('/v1/tasks/'+retryId+'/claim','POST');assert.equal(r.status,200);
          r=await req('/v1/tasks/'+retryId+'/fail','POST',{error:'transient test failure'});assert.equal(r.status,200);assert.equal(r.data.task.status,'retry');
          const deniedId='integration-denied';
          r=await req('/v1/tasks','POST',{task_id:deniedId,target:'staging',role:'tester',action:'noop'});assert.equal(r.status,201);
          r=await req('/v1/tasks/'+deniedId+'/claim','POST');assert.equal(r.status,200);
          r=await req('/v1/tasks/'+deniedId+'/fail','POST',{error:'ApprovalDenied: integration test'});assert.equal(r.status,200);assert.equal(r.data.task.status,'failed');
          r=await req('/v1/tasks/recover','POST',{stale_after_seconds:30});assert.equal(r.status,200);
          r=await req('/v1/tasks/pending','GET',undefined,true);assert.equal(r.status,200);
          console.log('PASS: HTTP auth, lifecycle, idempotency conflicts, retries, terminal failures, recovery');

          NODE
      - name: Verify executor integration over HTTP
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:8787';
          const headers={authorization:'Bearer integration-test-only-token','content-type':'application/json'};
          const r=await fetch(base+'/v1/tasks',{method:'POST',headers,body:JSON.stringify({task_id:'executor-smoke',target:'staging',role:'smoke',action:'noop',payload:{test:true}})});
          assert.equal(r.status,201);
          NODE
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const r=await fetch('http://127.0.0.1:8787/v1/tasks',{method:'POST',headers:{authorization:'Bearer integration-test-only-token','content-type':'application/json'},body:JSON.stringify({task_id:'executor-unregistered',target:'production',role:'admin',action:'shell',payload:{command:'echo unsafe'}})});
          assert.equal(r.status,201);
          NODE
          A1OS_QUEUE_URL=http://127.0.0.1:8787 A1OS_QUEUE_TOKEN=integration-test-only-token node executor.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const r=await fetch('http://127.0.0.1:8787/v1/tasks/executor-smoke',{headers:{authorization:'Bearer integration-test-only-token'}});
          assert.equal(r.status,200);
          const result=await r.json();
          assert.equal(result.data.status,'completed');
          assert.equal(result.data.attempts,1);
          const rejected=await fetch('http://127.0.0.1:8787/v1/tasks/executor-unregistered',{headers:{authorization:'Bearer integration-test-only-token'}});
          assert.equal(rejected.status,200);
          const unregistered=await rejected.json();
          assert.equal(unregistered.data.status,'queued','unregistered action must never execute');
          assert.equal(unregistered.data.attempts,0);
          console.log('PASS: executor completes allowlisted tasks and refuses unregistered actions');
          NODE
      - name: Worker diagnostics on failure
        if: failure()
        run: cat /tmp/a1os-worker.log || true
