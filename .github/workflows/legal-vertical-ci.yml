name: Legal Vertical CI

on:
  push:
    branches: [main]
    paths:
      - 'products/verticals/legal/**'
      - '.github/workflows/legal-vertical-ci.yml'
  pull_request:
    paths:
      - 'products/verticals/legal/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/verticals/legal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/verticals/legal/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
