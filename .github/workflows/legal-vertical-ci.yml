name: Legal Vertical CI
on:
  push:
    paths:
      - "products/verticals/legal/**"
      - ".github/workflows/legal-vertical-ci.yml"
  pull_request:
    paths:
      - "products/verticals/legal/**"
      - ".github/workflows/legal-vertical-ci.yml"
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/verticals/legal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/verticals/legal/package.json
      - run: npm install
      - run: npm test
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/verticals/legal/worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/verticals/legal/worker/package.json
      - run: npm install
      - run: npm test
      - run: npx wrangler deploy --dry-run
