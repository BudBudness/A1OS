name: Legal Vertical CI
on:
  push:
    paths:
      - "products/verticals/legal/**"
  pull_request:
    paths:
      - "products/verticals/legal/**"
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/verticals/legal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/verticals/legal/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
