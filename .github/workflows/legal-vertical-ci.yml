name: Legal Vertical CI

on:
  push:
    branches: [main]
    paths:
      - "products/verticals/legal/**"
      - ".github/workflows/legal-vertical-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "products/verticals/legal/**"
      - ".github/workflows/legal-vertical-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/verticals/legal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/verticals/legal/package.json
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Verify production artifacts
        run: |
          test -f dist/index.html
          test -f PRODUCT_CONSTITUTION.md
          echo "Legal vertical CI: PASS"
