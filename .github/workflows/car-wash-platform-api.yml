name: Car Wash Platform API CI

on:
  pull_request:
    branches: [main]
    paths:
      - "platform/a1os-platform-api/**"
      - ".github/workflows/car-wash-platform-api.yml"

permissions:
  contents: read

concurrency:
  group: car-wash-platform-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/a1os-platform-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/a1os-platform-api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test API
        run: pytest -q tests
