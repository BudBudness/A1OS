name: Legal Vertical CI

on:
  push:
    branches: [main]
    paths:
      - "products/verticals/legal/**"
      - ".github/workflows/legal-production-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "products/verticals/legal/**"
      - ".github/workflows/legal-production-e2e.yml"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/verticals/legal
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
