name: Legal Cloudflare build and security gate
on:
  push:
    branches: [main]
    paths:
      - "products/verticals/legal/**"
      - ".github/workflows/legal-production-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "products/verticals/legal/**"
      - ".github/workflows/legal-production-e2e.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify frontend
        working-directory: products/verticals/legal
        run: npm install && npm test && npm run build
      - name: Verify Worker
        working-directory: products/verticals/legal/worker
        run: npm install && npm test && npx wrangler deploy --dry-run
