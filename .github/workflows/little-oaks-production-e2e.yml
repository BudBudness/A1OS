name: Little Oaks Production E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-enquiry-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/verticals/little-oaks/package-lock.json
      - name: Install dependencies
        working-directory: products/verticals/little-oaks
        run: npm ci
      - name: Install E2E browser dependency
        working-directory: products/verticals/little-oaks
        run: npm install --no-save playwright@1.63.0
      - name: Install Chromium
        working-directory: products/verticals/little-oaks
        run: npx playwright install --with-deps chromium
      - name: Verify production enquiry flow
        env:
          LITTLE_OAKS_URL: https://little-oaks-one.vercel.app
        working-directory: products/verticals/little-oaks
        run: |
          cat > production-e2e.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base = process.env.LITTLE_OAKS_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          page.on('console', msg => console.log('[browser-console]', msg.type(), msg.text()));
          page.on('pageerror', error => console.log('[page-error]', error.message));
          page.on('requestfailed', request => console.log('[request-failed]', request.url(), request.failure()?.errorText));
          const response = await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 120000 });
          console.log(JSON.stringify({ page_status: response?.status() ?? null, final_url: page.url(), title: await page.title() }));
          if (!response || !response.ok()) throw new Error(`Production page failed: HTTP ${response?.status() ?? 'NO_RESPONSE'} at ${page.url()}`);
          await page.locator('form.enquiry-form').waitFor({ state: 'visible', timeout: 30000 });
          const marker = `E2E-${Date.now()}`;
          await page.getByLabel('Parent / guardian').fill(`Production E2E ${marker}`);
          await page.getByLabel('Child’s name').fill('E2E Child');
          await page.getByLabel('Child’s age').fill('4 years');
          await page.getByLabel('Programme').selectOption({ label: 'Montessori Nursery' });
          await page.getByLabel('Phone / WhatsApp').fill('+256700000001');
          await page.getByLabel('Message').fill(`Little Oaks production E2E ${marker}`);
          const [enquiryResponse] = await Promise.all([
            page.waitForResponse(r => r.url().includes('/rest/v1/enquiries') && r.request().method() === 'POST', { timeout: 30000 }),
            page.getByRole('button', { name: 'Send enquiry on WhatsApp' }).click()
          ]);
          console.log(JSON.stringify({ enquiry_http_status: enquiryResponse.status() }));
          if (!enquiryResponse.ok()) throw new Error(`Supabase enquiry POST failed: ${enquiryResponse.status()}`);
          const success = page.getByRole('status');
          await success.waitFor({ state: 'visible', timeout: 15000 });
          const successText = (await success.textContent())?.trim();
          if (!successText?.includes('Enquiry saved')) throw new Error(`Success state missing: ${successText}`);
          console.log(JSON.stringify({ status: 'PASS', site: base, success_state: successText, marker }));
          await browser.close();
          EOF
          node production-e2e.mjs
      - name: Build verification
        if: success()
        working-directory: products/verticals/little-oaks
        run: npm run build
