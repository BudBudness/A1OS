name: Little Oaks Worker Contract Tests

on:
  push:
    branches: [main]
    paths:
      - "products/verticals/little-oaks/**"
      - ".github/workflows/little-oaks-production-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "products/verticals/little-oaks/**"
      - ".github/workflows/little-oaks-production-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/verticals/little-oaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: products/verticals/little-oaks/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test Cloudflare Worker contract
        run: npm test
      - name: Build static application
        run: npm run build
