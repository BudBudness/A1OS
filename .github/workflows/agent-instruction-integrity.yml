name: Agent Instruction Integrity

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".github/copilot-instructions.md"
      - "scripts/control-plane/check_agent_instructions.py"
      - "scripts/control-plane/check_release_gates.py"
      - "canonical-control-plane/config/release-gates.json"
      - ".github/workflows/agent-instruction-integrity.yml"
      - ".github/hooks/**"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "**/AGENTS.md"
      - ".github/copilot-instructions.md"
      - "scripts/control-plane/check_agent_instructions.py"
      - ".github/workflows/agent-instruction-integrity.yml"
      - ".github/hooks/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-instruction-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instruction-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify Copilot hook enforcement
        run: python .github/hooks/a1os_instruction_guard.py --self-test
      - name: Verify hierarchy and conflict rules
        run: |
          python scripts/control-plane/check_agent_instructions.py --self-test
          python scripts/control-plane/check_agent_instructions.py --check
      - name: Verify canonical control-plane instruction chain
        run: |
          python scripts/control-plane/check_agent_instructions.py --preflight --for-path canonical-control-plane/src/
      - name: Validate fail-closed release gate manifest
        run: python scripts/control-plane/check_release_gates.py
      - name: Confirm production release remains blocked without evidence
        run: |
          set +e
          python scripts/control-plane/check_release_gates.py --evaluate
          code=$?
          set -e
          test "$code" -eq 2
