name: Car Wash Vertical CI
on:
  pull_request:
    paths:
      - "products/verticals/car-wash/**"
      - ".github/workflows/car-wash.yml"
  push:
    branches:
      - main
      - "feat/jeres-car-wash-production-readiness"
    paths:
      - "products/verticals/car-wash/**"
      - ".github/workflows/car-wash.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/verticals/car-wash
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run vertical contract tests
        run: npm test
      - name: Build production assets
        run: npm run build
