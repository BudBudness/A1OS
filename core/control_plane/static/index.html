<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A1OS Control Plane</title>
<style>
body{font-family:system-ui;background:#0b0d10;color:#eee;margin:0}
main{max-width:1100px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center}
.card{background:#151920;border:1px solid #292f38;border-radius:12px;padding:18px;margin-top:16px}
textarea,input,button{font:inherit}
textarea{width:100%;min-height:110px;background:#0b0d10;color:#eee;border:1px solid #39414c;border-radius:8px;padding:12px;box-sizing:border-box}
button{margin-top:10px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer}
pre{white-space:pre-wrap;overflow:auto;background:#080a0d;padding:14px;border-radius:8px}
.ok{color:#7ee787}.warn{color:#f2cc60}
</style>
</head>
<body>
<main>
<header>
<h1>A1OS Control Plane</h1>
<strong id="state" class="warn">CONNECTING</strong>
</header>

<div class="card">
<h2>Command</h2>
<textarea id="command" placeholder="Tell A1OS what you want done..."></textarea>
<br>
<button onclick="plan()">Plan / Request Approval</button>
<button onclick="execute()">Approve & Execute</button>
</div>

<div class="card">
<h2>System</h2>
<pre id="status">Loading...</pre>
</div>

<div class="card">
<h2>Execution Output</h2>
<pre id="output"></pre>
</div>

<script>
const $ = id => document.getElementById(id);

async function refresh() {
  const r = await fetch('/api/status');
  $('status').textContent = JSON.stringify(await r.json(), null, 2);
  $('state').textContent = 'ONLINE';
  $('state').className = 'ok';
}

async function send(approve) {
  const command = $('command').value.trim();
  if (!command) return;
  const r = await fetch('/api/command', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({command, approve})
  });
  const data = await r.json();
  $('output').textContent = JSON.stringify(data, null, 2);
}

function plan(){ send(false); }
function execute(){ send(true); }

refresh();
setInterval(refresh, 5000);

const ws = new WebSocket(
  `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`
);
</script>
</main>
</body>
</html>
