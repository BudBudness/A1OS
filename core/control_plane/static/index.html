<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A1OS Control Center</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#080b12;color:#eef2f7}
body{margin:0;background:#080b12}main{max-width:900px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #273142;padding-bottom:16px}
.badge{padding:6px 10px;border:1px solid #2e8b68;border-radius:999px;color:#6ee7b7}
#messages{min-height:55vh;padding:24px 0}.msg{padding:12px 14px;margin:10px 0;border:1px solid #273142;border-radius:12px;white-space:pre-wrap}
.user{background:#121a28}.system{background:#0d1512}
form{display:flex;gap:8px;position:sticky;bottom:0;background:#080b12;padding:12px 0}
input{flex:1;padding:13px;border-radius:10px;border:1px solid #273142;background:#0d121b;color:#fff}
button{padding:12px 16px;border:0;border-radius:10px;background:#5b6cff;color:white;font-weight:700}
</style>
</head>
<body>
<main>
<header><div><strong>A1OS CONTROL CENTER</strong><div>Deterministic platform control</div></div><span class="badge">ONLINE · APPROVAL GATED</span></header>
<section id="messages"><div class="msg system">A1OS is ready. Operations are explicit and approval-gated.</div></section>
<form id="form"><input id="command" autocomplete="off" placeholder="Enter an approved control operation"><button>Run</button></form>
<script>
const form=document.getElementById("form"),input=document.getElementById("command"),messages=document.getElementById("messages");
function add(text,cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;messages.appendChild(d);d.scrollIntoView({behavior:"smooth"});}
form.addEventListener("submit",async e=>{
 e.preventDefault(); const command=input.value.trim(); if(!command)return;
 add(command,"user"); input.value="";
 try{
  const r=await fetch("/api/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command,approve:false})});
  const d=await r.json(); add(JSON.stringify(d,null,2),"system");
 }catch(err){add(String(err),"system")}
});
</script>
</main>
</body>
</html>
