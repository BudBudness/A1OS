name = "barya-legal-api"
main = "src/index.js"
compatibility_date = "2026-11-20"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "barya-legal"
database_id = "00000000000000000000000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "barya-legal-documents"

[vars]
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_ACCOUNT.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_CLOUDFLARE_ACCESS_APPLICATION_AUD"

[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
