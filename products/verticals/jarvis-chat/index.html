<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>🤖 JARVIS Chat</title>
<style>body{font-family:system-ui;background:#0a0a0f;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;margin:0}#header{background:#1a1a2e;padding:16px 20px;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px}#header h1{font-size:20px;background:linear-gradient(135deg,#00d4ff,#7b2ffc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}#status{font-size:12px;color:#4ade80;background:#1a3a2a;padding:4px 12px;border-radius:20px}#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.msg{max-width:80%;padding:12px 16px;border-radius:12px;animation:fadeIn .3s}.user{align-self:flex-end;background:#1a3a5a;border:1px solid #2a5a7a}.jarvis{align-self:flex-start;background:#1a1a2e;border:1px solid #333}.msg pre{background:#0a0a12;padding:8px;border-radius:6px;font-size:12px;overflow-x:auto;margin-top:6px;white-space:pre-wrap;word-break:break-all}#input-area{display:flex;gap:10px;padding:16px 20px;background:#1a1a2e;border-top:1px solid #333}#input{flex:1;padding:12px 16px;border-radius:24px;border:1px solid #333;background:#0a0a12;color:#e0e0e0;font-size:14px;outline:none}#input:focus{border-color:#7b2ffc}#send{padding:12px 24px;border-radius:24px;border:none;background:linear-gradient(135deg,#00d4ff,#7b2ffc);color:#fff;font-weight:600;cursor:pointer}#send:hover{opacity:.85}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.loading{color:#888;font-style:italic}</style>
</head>
<body>
<div id="header"><h1>🤖 JARVIS</h1><span id="status">● ONLINE</span></div>
<div id="chat"></div>
<div id="input-area"><input id="input" placeholder="Ask JARVIS anything..." autofocus /><button id="send">Send</button></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send');
function addMessage(role,content){const div=document.createElement('div');div.className='msg '+role;div.innerHTML=content.replace(/\n/g,'<br>');chat.appendChild(div);chat.scrollTop=chat.scrollHeight}
async function sendCommand(){const text=input.value.trim();if(!text)return;input.value='';addMessage('user','💬 '+text);const loading=document.createElement('div');loading.className='msg jarvis loading';loading.textContent='⏳ Thinking...';chat.appendChild(loading);chat.scrollTop=chat.scrollHeight;try{const res=await fetch('/api/jarvis/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:text})});const data=await res.json();loading.remove();if(data.intent==='terminal'&&data.requires_approval){addMessage('jarvis','⚠️ Approval needed. Token: '+data.approval_token)}else if(data.status==='healthy'||data.status==='online'){addMessage('jarvis','✅ '+(data.message||'System healthy'))}else if(data.output){addMessage('jarvis','📋 Output:\n<pre>'+data.output+'</pre>')}else if(data.detail){addMessage('jarvis','❌ '+data.detail)}else{addMessage('jarvis','📦 Response:\n<pre>'+JSON.stringify(data,null,2)+'</pre>')}}catch(e){loading.remove();addMessage('jarvis','❌ '+e.message)}}
input.addEventListener('keydown',e=>{if(e.key==='Enter')sendCommand()});sendBtn.addEventListener('click',sendCommand);
fetch('/api/jarvis/status').then(r=>r.json()).then(d=>{document.getElementById('status').textContent='● '+d.status.toUpperCase()}).catch(()=>{});
</script>
</body>
</html>
