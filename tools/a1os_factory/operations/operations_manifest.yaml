factory:
  version: "1.7"
  name: "A1OS Autonomous Deployment Operations Engine"

pipeline:
  - generate_environment
  - generate_containers
  - generate_ci_cd
  - generate_monitoring
  - generate_backup
  - generate_readiness_checks

operations_layers:

  deployment:
    - docker
    - compose
    - environments
    - secrets_template

  cicd:
    - github_actions
    - build_pipeline
    - test_pipeline
    - release_pipeline

  monitoring:
    - health_checks
    - metrics
    - logging
    - alerts

  recovery:
    - backup_jobs
    - restore_jobs
    - disaster_recovery

  production:
    - readiness
    - security_checks
    - deployment_manifest
