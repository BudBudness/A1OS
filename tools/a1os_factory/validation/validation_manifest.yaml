factory:
  version: "1.8"
  name: "A1OS Autonomous Validation Self-Healing Engine"

pipeline:
  - inspect_structure
  - validate_dependencies
  - validate_api_contracts
  - security_scan
  - health_validation
  - generate_repair_plan
  - create_validation_manifest

validation_layers:

  architecture:
    - folder_validation
    - manifest_validation
    - module_validation

  dependencies:
    - package_check
    - python_dependency_check
    - runtime_check

  api:
    - route_validation
    - endpoint_check
    - schema_check

  security:
    - rbac_check
    - secret_check
    - permission_check
    - audit_check

  operations:
    - deployment_check
    - monitoring_check
    - backup_check

  recovery:
    - issue_detection
    - repair_recommendations
    - compatibility_report
