  - event_engine_generation
  - automation_builder_generation
  - approval_flow_generation
  - sla_monitor_generation
  - workflow_analytics_generation
  - process_optimization

capabilities:

  workflows:
    - visual_workflow_engine
    - process_templates
    - workflow_versions
